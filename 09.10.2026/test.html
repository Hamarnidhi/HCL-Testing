<!DOCTYPE html>

<body>
    <div class="form-container">
        <h2>Login</h2>
        <div class="form-group">
            <label for="email">
                Email Address
            </label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="password">
                Password
            </label>
            <input type="password" id="password" name="password">
        </div>

        <button type="submit">
            Submit
        </button>
    </div>
</body>
